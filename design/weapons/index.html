<style>
:root {
  --bg:#111620; --surface:#1d2438; --raised:#26304a;
  --border:#334060; --border2:#253050;
  --text:#ddd0b0; --muted:#7888a8; --dim:#404e68;
  --accent:#c8a040; --accent-lo:rgba(200,160,64,.12);
  --frost:#56aed0; --emerald:#52a870; --danger:#c04848;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0e4cc; --surface:#e0cca8; --raised:#d4be94;
  --border:#b89e70; --border2:#c8ae80;
  --text:#1c140a; --muted:#7a6040; --dim:#a89068;
  --accent:#8a5c10; --accent-lo:rgba(138,92,16,.10);
  --frost:#1e72a0; --emerald:#2a7848; --danger:#a02020;
}}
:root[data-theme="light"]{
  --bg:#f0e4cc; --surface:#e0cca8; --raised:#d4be94;
  --border:#b89e70; --border2:#c8ae80;
  --text:#1c140a; --muted:#7a6040; --dim:#a89068;
  --accent:#8a5c10; --accent-lo:rgba(138,92,16,.10);
  --frost:#1e72a0; --emerald:#2a7848; --danger:#a02020;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif SC','SimSun',serif;font-size:15px;line-height:1.7;min-height:100vh;}
.page{max-width:1100px;margin:0 auto;padding:0 24px 80px;}

.site-header{padding:40px 0 32px;border-bottom:1px solid var(--border2);margin-bottom:32px;}
.breadcrumb{font-size:.7rem;letter-spacing:.16em;color:var(--dim);margin-bottom:12px;}
.breadcrumb a{color:var(--dim);text-decoration:none;}
.breadcrumb a:hover{color:var(--accent);}
.header-row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
.page-title{font-family:'Cinzel',serif;font-weight:700;font-size:2rem;letter-spacing:.1em;color:var(--accent);}
.page-sub{color:var(--muted);font-size:.9rem;margin-left:auto;}

.stats-bar{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:28px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:4px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat-val{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
.stat-lbl{font-size:.68rem;letter-spacing:.1em;color:var(--muted);}

.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
.search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:9px 14px;color:var(--text);font-family:inherit;font-size:.88rem;outline:none;}
.search:focus{border-color:var(--accent);}
.search::placeholder{color:var(--dim);}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border:1px solid var(--border);background:none;color:var(--muted);font-family:'Noto Serif SC',serif;font-size:.72rem;letter-spacing:.08em;border-radius:2px;cursor:pointer;transition:all .15s;}
.filter-btn:hover,.filter-btn.active{background:var(--accent-lo);border-color:var(--accent);color:var(--accent);}

.weapon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}

.weapon-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;transition:transform .15s,border-color .2s;}
.weapon-card:hover{transform:translateY(-3px);border-color:var(--card-col,var(--accent));}
.card-top{padding:38px 18px 14px;position:relative;}
.card-top::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--card-col,var(--accent));}

.card-sym-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.card-sym{font-size:2rem;line-height:1;width:44px;text-align:center;}
.card-title-block{flex:1;}
.card-name{font-weight:600;font-size:1rem;color:var(--text);margin-bottom:3px;}
.cd-row{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;}
.cd-bar{width:48px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.cd-fill{height:100%;background:var(--card-col,var(--accent));opacity:.55;}

.card-effect{font-size:.85rem;color:var(--muted);line-height:1.55;margin-bottom:10px;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:.62rem;letter-spacing:.08em;padding:3px 8px;border-radius:2px;border:1px solid var(--border2);color:var(--dim);}

.status{position:absolute;top:12px;right:12px;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px;}
.s-designed{background:var(--accent-lo);border:1px solid rgba(200,160,64,.3);color:var(--accent);}
.s-todo{background:rgba(64,78,104,.3);border:1px solid var(--border);color:var(--dim);}

/* level table */
.card-bottom{padding:12px 18px 16px;border-top:1px solid var(--border2);background:var(--raised);}
.section-label{font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.lv-table{width:100%;border-collapse:collapse;font-size:.78rem;font-variant-numeric:tabular-nums;}
.lv-table th{font-size:.6rem;letter-spacing:.1em;color:var(--dim);text-align:left;padding:0 6px 4px;border-bottom:1px solid var(--border2);font-weight:400;}
.lv-table td{padding:5px 6px;border-bottom:1px solid var(--border2);vertical-align:top;color:var(--muted);}
.lv-table tr:last-child td{border-bottom:none;}
.lv-table .lv-badge{display:inline-block;font-size:.6rem;letter-spacing:.06em;padding:1px 6px;border-radius:2px;border:1px solid var(--card-col,var(--accent));color:var(--card-col,var(--accent));white-space:nowrap;font-variant-numeric:normal;}
.lv-table .dmg{color:var(--text);font-weight:600;}
.lv-table .trait{color:var(--muted);}

.empty{text-align:center;padding:60px 20px;color:var(--dim);font-size:.95rem;}

/* enchantment section */
.section-title{font-family:'Cinzel',serif;font-size:1.1rem;letter-spacing:.1em;color:var(--accent);margin:48px 0 16px;}
.enchant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.enchant-card{background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:14px 16px;}
.enchant-card:hover{border-color:var(--frost);}
.enchant-name{font-weight:600;font-size:.9rem;color:var(--frost);margin-bottom:4px;}
.enchant-desc{font-size:.8rem;color:var(--muted);line-height:1.5;}

@media(max-width:600px){.weapon-grid,.enchant-grid{grid-template-columns:1fr;}.header-row{flex-direction:column;align-items:flex-start;}}
.dev-notes{margin-top:12px;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}.dev-notes summary{cursor:pointer;color:var(--accent)}.dev-notes p{margin-top:8px}.card-name,.lv-table td{overflow-wrap:anywhere}
</style>

<div class="page">
  <header class="site-header">
    <div class="breadcrumb"><a href="../../README.md">Wardstep</a> / design / weapons</div>
    <div class="header-row">

  </p>
</div>

      "trait": "持续2.5秒，每0.5秒造成伤害；激活瞬间额外突刺造成4伤害。 / Active for 2.5s; deals damage every 0.5s. An initial spike burst deals an additional 4 damage on activation."
    }
  ],
  "notes": "固定于格子，不跟随或伤害骑士，不阻挡敌人。冷却结束后可再次激活，仅刷新持续时间，不叠加区域。由骑士踩格启动，区别于敌人触发的陷阱。 / Fixed around the tile; does not follow or damage the knight, or block enemies. Reactivation requires cooldown completion and refreshes duration without stacking fields. Triggered by the knight, unlike enemy-triggered traps."
},
];

const NEW_WEAPON_IDS = new Set(["chain-hook","heavy-crossbow","gravity-orb","runic-cannon","repulsion-bell","spike-array"]);

function buildFilters(){
  const newButton=document.getElementById("new-weapons");
  newButton.addEventListener("click",()=>{
    document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));
    newButton.classList.add("active");render();
  });
  const all=new Set();
  WEAPONS.forEach(w=>w.tags.forEach(t=>all.add(t)));
  const bar=document.getElementById('filters');
  all.forEach(t=>{
    const b=document.createElement('button');
    b.className='filter-btn';b.dataset.tag=t;b.textContent=t;
    b.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');render();
    });
    bar.appendChild(b);
  });
  document.querySelector('[data-tag="全部"]').addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    document.querySelector('[data-tag="全部"]').classList.add('active');render();
  });
}

function activeTag(){return document.querySelector('.filter-btn.active')?.dataset.tag||'全部';}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const tag=activeTag();
  const list=WEAPONS.filter(w=>{
    const newOnly=document.getElementById('new-weapons').classList.contains('active');
    const tagOk=newOnly?NEW_WEAPON_IDS.has(w.id):(tag==='全部'||w.tags.includes(tag));
    const qOk=!q||w.name.toLowerCase().includes(q)||w.effect.toLowerCase().includes(q)||w.tags.some(t=>t.includes(q));
    return tagOk&&qOk;
  });
  document.getElementById('stat-count').textContent=WEAPONS.length;
  document.getElementById('stat-total').textContent=WEAPONS.filter(w=>w.status==='designed').length;
  document.getElementById('stat-types').textContent=new Set(WEAPONS.flatMap(w=>w.tags.filter(t=>!['基础','进阶'].includes(t)))).size;
  const grid=document.getElementById('weapon-grid');
  grid.innerHTML='';
  document.getElementById('empty').style.display=list.length?'none':'block';
  list.forEach(w=>{
    const statusCls=w.status==='designed'?'s-designed':'s-todo';
    const statusLbl=w.status==='designed'?'已设计':'设计中';
    const rows=w.levels.map(l=>`
      <tr>
        <td><span class="lv-badge">${l.lv}</span></td>
        <td class="dmg">${l.stat}</td>
        <td class="trait">${l.trait}</td>
      </tr>`).join('');
    grid.innerHTML+=`
    <div class="weapon-card" style="--card-col:${w.color}">
      <div class="card-top">
        <span class="status ${statusCls}">${statusLbl}</span>
        <div class="card-sym-row">
          <div class="card-sym">${w.symbol}</div>
          <div class="card-title-block">
            <div class="card-name">${w.name}</div>
            <div class="cd-row">CD ${w.cd}
              <div class="cd-bar"><div class="cd-fill" style="width:${w.cdPct}%"></div></div>
            </div>
          </div>
        </div>
        <div class="card-effect">${w.effect}</div>
        <div class="card-tags">${w.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="card-bottom">
        <div class="section-label">升级数据 / Level Progression</div>
        <table class="lv-table">
          <thead><tr><th>等级 / Level</th><th>数值 / Stats</th><th>特性 / Traits</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${w.notes ? `<details class="dev-notes"><summary>开发规则 / Development Notes</summary><p>${w.notes}</p></details>` : ''}
      </div>
    </div>`;
  });
}

buildFilters();
render();
document.getElementById('search').addEventListener('input',render);
</script>
