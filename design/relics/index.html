<title>Wardstep · 遗物图鉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@300;400;600&display=swap">

<style>
:root {
  --bg:#111620;--surface:#1d2438;--raised:#26304a;
  --border:#334060;--border2:#253050;
  --text:#ddd0b0;--muted:#7888a8;--dim:#404e68;
  --accent:#c8a040;--accent-lo:rgba(200,160,64,.12);
  --frost:#56aed0;--emerald:#52a870;--danger:#c04848;--violet:#9070d0;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0e4cc;--surface:#e0cca8;--raised:#d4be94;
  --border:#b89e70;--border2:#c8ae80;
  --text:#1c140a;--muted:#7a6040;--dim:#a89068;
  --accent:#8a5c10;--accent-lo:rgba(138,92,16,.10);
  --frost:#1e72a0;--emerald:#2a7848;--danger:#a02020;--violet:#6040a0;
}}
:root[data-theme="light"]{
  --bg:#f0e4cc;--surface:#e0cca8;--raised:#d4be94;
  --border:#b89e70;--border2:#c8ae80;
  --text:#1c140a;--muted:#7a6040;--dim:#a89068;
  --accent:#8a5c10;--accent-lo:rgba(138,92,16,.10);
  --frost:#1e72a0;--emerald:#2a7848;--danger:#a02020;--violet:#6040a0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif SC','SimSun',serif;font-size:15px;line-height:1.7;min-height:100vh;}
.page{max-width:1100px;margin:0 auto;padding:0 24px 80px;}

.site-header{padding:40px 0 32px;border-bottom:1px solid var(--border2);margin-bottom:32px;}
.breadcrumb{font-size:.7rem;letter-spacing:.16em;color:var(--dim);margin-bottom:12px;}
.breadcrumb a{color:var(--dim);text-decoration:none;}
.breadcrumb a:hover{color:var(--accent);}
.header-row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
.page-title{font-family:'Cinzel',serif;font-weight:700;font-size:2rem;letter-spacing:.1em;color:var(--accent);}
.page-sub{color:var(--muted);font-size:.9rem;margin-left:auto;}

.stats-bar{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:28px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:4px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat-val{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
.stat-lbl{font-size:.68rem;letter-spacing:.1em;color:var(--muted);}

.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{padding:6px 14px;border:1px solid var(--border);background:none;color:var(--muted);font-family:'Noto Serif SC',serif;font-size:.72rem;letter-spacing:.08em;border-radius:2px;cursor:pointer;transition:all .15s;}
.filter-btn:hover,.filter-btn.active{background:var(--accent-lo);border-color:var(--accent);color:var(--accent);}

.relic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}

.relic-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px;transition:transform .15s,border-color .2s;position:relative;}
.relic-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--cat-col,var(--accent));border-radius:4px 4px 0 0;}
.relic-card:hover{transform:translateY(-2px);border-color:var(--cat-col,var(--accent));}

.relic-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;}
.relic-icon{width:48px;height:48px;border-radius:50%;background:var(--raised);border:2px solid var(--cat-col,var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;}
.relic-meta{flex:1;}
.relic-name{font-weight:600;font-size:.98rem;color:var(--text);margin-bottom:2px;}
.relic-cat{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cat-col,var(--accent));padding:2px 7px;border:1px solid currentColor;border-radius:2px;display:inline-block;opacity:.8;}
.relic-rarity{position:absolute;top:14px;right:14px;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:2px;}
.r-common{background:rgba(120,136,168,.15);border:1px solid var(--border);color:var(--dim);}
.r-rare{background:rgba(86,174,208,.1);border:1px solid rgba(86,174,208,.3);color:var(--frost);}
.r-epic{background:rgba(144,112,208,.12);border:1px solid rgba(144,112,208,.35);color:var(--violet);}

.relic-effect{font-size:.88rem;color:var(--text);line-height:1.6;margin-bottom:10px;}
.relic-note{font-size:.78rem;color:var(--muted);line-height:1.5;border-left:2px solid var(--border2);padding-left:10px;}

.empty{text-align:center;padding:60px 20px;color:var(--dim);font-size:.95rem;}

@media(max-width:600px){.relic-grid{grid-template-columns:1fr;}.header-row{flex-direction:column;align-items:flex-start;}}
</style>

<div class="page">
  <header class="site-header">
    <div class="breadcrumb"><a href="../../README.md">Wardstep</a> / design / relics</div>
    <div class="header-row">
      <div class="page-title">遗物图鉴</div>
      <div class="page-sub">精英关后三选一 · 永久生效 · 叠加构筑</div>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-lbl">遗物总数</div></div>
    <div class="stat"><div class="stat-val">5</div><div class="stat-lbl">分类</div></div>
    <div class="stat"><div class="stat-val">5</div><div class="stat-lbl">最大持有数</div></div>
    <div class="stat"><div class="stat-val">3</div><div class="stat-lbl">稀有度</div></div>
  </div>

  <div class="controls">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-cat="全部">全部</button>
    </div>
  </div>

  <div class="relic-grid" id="relic-grid"></div>
  <div class="empty" id="empty" style="display:none">没有找到遗物</div>
</div>

<script>
const CAT_COLOR = {
  "攻击":"#c04848","防御":"#5080c8","格子":"#52a870","骑士":"#c8a040","特殊":"#9070d0"
};

const RELICS = [
  // 攻击
  {
    icon:"⚔",name:"战争印记",cat:"攻击",rarity:"common",
    effect:"所有武器基础伤害 +12%。",
    note:"最直接的增益，适合任何构筑。"
  },
  {
    icon:"🩸",name:"血月护符",cat:"攻击",rarity:"rare",
    effect:"城堡每损失10% HP，所有武器伤害 +6%，最多叠加5层（+30%）。",
    note:"高风险高回报——越濒死越强。搭配守卫职业效果极佳，可稳住血量同时享受增伤。"
  },
  {
    icon:"⚡",name:"连锁爆发",cat:"攻击",rarity:"rare",
    effect:"武器命中后，有18%概率立即对同一目标再触发一次同格武器攻击（不重置CD）。",
    note:"高伤武器（法杖、钢矛Lv3）与此遗物协同极高。"
  },
  {
    icon:"🎯",name:"精准信条",cat:"攻击",rarity:"epic",
    effect:"远程武器和法系武器命中率100%（无视盾挡），穿透效果判定层数+1。",
    note:"弓手职业搭配此遗物后，穿透箭可贯穿4个敌人而非3个。"
  },
  // 防御
  {
    icon:"🛡",name:"铁壁誓约",cat:"防御",rarity:"common",
    effect:"护盾武器（骑士盾）产生的护盾值 +35%。",
    note:"守卫职业专属增益，叠加后Lv3盾护盾高达59。"
  },
  {
    icon:"🔄",name:"反弹魔纹",cat:"防御",rarity:"rare",
    effect:"护盾被击破时，对破盾攻击者造成等于护盾值15%的伤害反弹。",
    note:"使防御格子具备进攻意义，适合以盾流为核心的守卫构筑。"
  },
  {
    icon:"⏳",name:"时间沙漏",cat:"防御",rarity:"epic",
    effect:"每场精英关和Boss关开始时，全场敌人冻结3秒；冻结期间骑士走完第一圈不消耗武器CD。",
    note:"为布置阵型争取宝贵的首轮输出窗口，复杂阵型首选。"
  },
  // 格子
  {
    icon:"📐",name:"扩展蓝图",cat:"格子",rarity:"rare",
    effect:"可放置格子数量上限从 9 增加到 11，允许拼接更复杂的路径形状。",
    note:"根本性改变格子设计空间，开启更多阵型可能（双环形、螺旋形等）。"
  },
  {
    icon:"⚙",name:"工匠印鉴",cat:"格子",rarity:"common",
    effect:"所有格子上武器的冷却时间 -15%。",
    note:"相当于骑士走得更快，触发频率整体提升。"
  },
  {
    icon:"💎",name:"附魔宝石",cat:"格子",rarity:"rare",
    effect:"每个附魔格子触发附魔效果时，有22%概率附魔不消耗自身冷却（即本圈可重复触发）。",
    note:"毒素附魔叠满3层的效率翻倍，火焰附魔持续灼烧不断。"
  },
  {
    icon:"🌀",name:"轮回印记",cat:"格子",rarity:"epic",
    effect:"骑士每踩满一整圈路径，随机一格的武器立即复位CD（无论当前状态）。",
    note:"长路径构筑专属——格子越多，收益越稳定。"
  },
  // 骑士
  {
    icon:"🥾",name:"疾风靴",cat:"骑士",rarity:"common",
    effect:"骑士基础移速 +18%，踩格触发间隔缩短。",
    note:"DPS核心，在格子不变的情况下相当于武器触发频率提升。"
  },
  {
    icon:"🏆",name:"骑士荣耀",cat:"骑士",rarity:"rare",
    effect:"骑士每踩完一整圈，获得5%伤害加成（叠加至最多+30%），受到伤害时清空层数。",
    note:"需要保持城堡不受伤以积累层数，守护策略与之高度绑定。"
  },
  {
    icon:"🌙",name:"月光勋章",cat:"骑士",rarity:"epic",
    effect:"骑士移速随当前波次进度提升，最终（第15波）时移速基础值+45%；死亡的敌人数量也贡献速度（每10击杀+3%，上限+20%）。",
    note:"越打到后期越强，Boss关决战前通常已积累大量加速。"
  },
  // 特殊
  {
    icon:"🖤",name:"黑暗契约",cat:"特殊",rarity:"epic",
    effect:"城堡最大HP -25%，但所有武器伤害 +35%，武器CD -10%。",
    note:"大幅降低容错率，换取全面强化——配合血月护符时两者相互增益，风险变为优势。"
  },
  {
    icon:"💰",name:"贪婪算盘",cat:"特殊",rarity:"rare",
    effect:"每获得5金币，永久提升所有武器伤害1%（本局内，上限+20%）。",
    note:"鼓励积极购买和出售武器，让商店行为本身成为构筑的一部分。"
  },
];

function buildFilters(){
  const cats=[...new Set(RELICS.map(r=>r.cat))];
  const bar=document.getElementById('filters');
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='filter-btn';b.dataset.cat=c;b.textContent=c;
    b.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');render();
    });
    bar.appendChild(b);
  });
  document.querySelector('[data-cat="全部"]').addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    document.querySelector('[data-cat="全部"]').classList.add('active');render();
  });
}

function activeCat(){return document.querySelector('.filter-btn.active')?.dataset.cat||'全部';}

function render(){
  const cat=activeCat();
  const list=cat==='全部'?RELICS:RELICS.filter(r=>r.cat===cat);
  document.getElementById('stat-total').textContent=RELICS.length;
  const grid=document.getElementById('relic-grid');
  grid.innerHTML='';
  document.getElementById('empty').style.display=list.length?'none':'block';
  const rarityMap={common:'普通',rare:'稀有',epic:'史诗'};
  const rarityClass={common:'r-common',rare:'r-rare',epic:'r-epic'};
  list.forEach(r=>{
    const col=CAT_COLOR[r.cat]||'var(--accent)';
    grid.innerHTML+=`
    <div class="relic-card" style="--cat-col:${col}">
      <span class="relic-rarity ${rarityClass[r.rarity]}">${rarityMap[r.rarity]}</span>
      <div class="relic-head">
        <div class="relic-icon">${r.icon}</div>
        <div class="relic-meta">
          <div class="relic-name">${r.name}</div>
          <span class="relic-cat">${r.cat}</span>
        </div>
      </div>
      <div class="relic-effect">${r.effect}</div>
      ${r.note?`<div class="relic-note">${r.note}</div>`:''}
    </div>`;
  });
}

buildFilters();render();
</script>
