<title>Wardstep · 关卡设计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@300;400;600&display=swap">

<style>
:root {
  --bg:#111620;--surface:#1d2438;--raised:#26304a;
  --border:#334060;--border2:#253050;
  --text:#ddd0b0;--muted:#7888a8;--dim:#404e68;
  --accent:#c8a040;--accent-lo:rgba(200,160,64,.12);
  --frost:#56aed0;--emerald:#52a870;--danger:#c04848;--violet:#9070d0;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0e4cc;--surface:#e0cca8;--raised:#d4be94;
  --border:#b89e70;--border2:#c8ae80;
  --text:#1c140a;--muted:#7a6040;--dim:#a89068;
  --accent:#8a5c10;--accent-lo:rgba(138,92,16,.10);
  --frost:#1e72a0;--emerald:#2a7848;--danger:#a02020;--violet:#6040a0;
}}
:root[data-theme="light"]{
  --bg:#f0e4cc;--surface:#e0cca8;--raised:#d4be94;
  --border:#b89e70;--border2:#c8ae80;
  --text:#1c140a;--muted:#7a6040;--dim:#a89068;
  --accent:#8a5c10;--accent-lo:rgba(138,92,16,.10);
  --frost:#1e72a0;--emerald:#2a7848;--danger:#a02020;--violet:#6040a0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif SC','SimSun',serif;font-size:15px;line-height:1.7;min-height:100vh;}
.page{max-width:1100px;margin:0 auto;padding:0 24px 80px;}

.site-header{padding:40px 0 32px;border-bottom:1px solid var(--border2);margin-bottom:36px;}
.breadcrumb{font-size:.7rem;letter-spacing:.16em;color:var(--dim);margin-bottom:12px;}
.breadcrumb a{color:var(--dim);text-decoration:none;}
.breadcrumb a:hover{color:var(--accent);}
.header-row{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
.page-title{font-family:'Cinzel',serif;font-weight:700;font-size:2rem;letter-spacing:.1em;color:var(--accent);}
.page-sub{color:var(--muted);font-size:.9rem;margin-left:auto;}

/* act progress strip */
.act-nav{display:flex;gap:0;margin-bottom:36px;overflow-x:auto;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.act-pip{flex:1;min-width:80px;padding:10px 8px;text-align:center;cursor:pointer;border-right:1px solid var(--border);background:var(--surface);transition:background .15s;}
.act-pip:last-child{border-right:none;}
.act-pip:hover,.act-pip.active{background:var(--accent-lo);}
.act-pip.active .pip-num{color:var(--accent);}
.pip-num{font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.1em;color:var(--dim);display:block;transition:color .15s;}
.pip-emoji{font-size:1.1rem;display:block;margin-bottom:2px;}
.pip-name{font-size:.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* act card */
.act-card{display:none;}
.act-card.active{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

.act-left,.act-right{display:flex;flex-direction:column;gap:14px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--border2);background:var(--raised);display:flex;align-items:center;gap:10px;}
.panel-icon{font-size:1.1rem;}
.panel-label{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);}
.panel-body{padding:14px 16px;}

.act-hero{border-top:4px solid var(--act-col,var(--accent));background:var(--surface);}
.act-hero .panel-head{background:color-mix(in srgb,var(--act-col,var(--accent)) 8%,var(--surface));}
.act-num-big{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;padding:3px 9px;border:1px solid var(--act-col,var(--accent));color:var(--act-col,var(--accent));border-radius:2px;}
.act-name-big{font-family:'Cinzel',serif;font-size:1.1rem;letter-spacing:.06em;color:var(--text);}
.act-terrain-label{font-size:.78rem;color:var(--muted);}

/* terrain grid preview */
.terrain-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px;background:var(--raised);border-radius:3px;aspect-ratio:5/3;}
.t-cell{border-radius:2px;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:.75rem;}
.t-normal{background:rgba(120,136,168,.15);}
.t-blocked{background:rgba(64,78,104,.35);color:var(--dim);}
.t-special{background:color-mix(in srgb,var(--act-col,var(--accent)) 18%,transparent);border-color:color-mix(in srgb,var(--act-col,var(--accent)) 30%,transparent);}
.t-castle{background:rgba(200,160,64,.2);border-color:rgba(200,160,64,.4);color:var(--accent);font-size:.65rem;}
.t-enemy{background:rgba(192,72,72,.15);border-color:rgba(192,72,72,.25);color:var(--danger);}
.grid-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.62rem;color:var(--dim);}
.legend-dot{width:10px;height:10px;border-radius:1px;border:1px solid rgba(255,255,255,.08);}

/* waves */
.wave-list{display:flex;flex-direction:column;gap:8px;}
.wave-row{display:flex;align-items:flex-start;gap:10px;font-size:.82rem;}
.wave-badge{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.1em;padding:3px 7px;border-radius:2px;flex-shrink:0;margin-top:2px;}
.w-small{background:rgba(120,136,168,.15);border:1px solid var(--border);color:var(--muted);}
.w-elite{background:rgba(86,174,208,.1);border:1px solid rgba(86,174,208,.3);color:var(--frost);}
.w-boss{background:rgba(192,72,72,.12);border:1px solid rgba(192,72,72,.3);color:var(--danger);}
.wave-desc{color:var(--muted);line-height:1.55;}

/* terrain effect */
.effect-box{background:var(--raised);border-left:3px solid var(--act-col,var(--accent));padding:10px 12px;border-radius:0 3px 3px 0;font-size:.85rem;color:var(--text);line-height:1.6;}
.effect-name{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--act-col,var(--accent));margin-bottom:4px;}

.tip-box{font-size:.8rem;color:var(--muted);line-height:1.6;padding:10px 14px;background:var(--raised);border-radius:3px;border:1px solid var(--border2);}
.tip-label{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}

@media(max-width:720px){.act-card.active{grid-template-columns:1fr;}.act-nav{gap:0;}}
</style>

const CELL_COLORS = {
  n:"t-normal",b:"t-blocked",s:"t-special",d:"t-blocked",
  e:"t-enemy",h:"t-special",w:"t-special",v:"t-special",c:"t-castle"
};
const CELL_EMOJI = {b:"🌲",d:"🌋",e:"⚔",h:"⚡",w:"🌊",v:"💨",c:"🏰"};

function buildNav(){
  const nav=document.getElementById('act-nav');
  ACTS.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='act-pip'+(i===0?' active':'');
    d.innerHTML=`<span class="pip-emoji">${a.emoji}</span><span class="pip-num">ACT ${a.n}</span><span class="pip-name">${a.name}</span>`;
    d.addEventListener('click',()=>{
      document.querySelectorAll('.act-pip').forEach(x=>x.classList.remove('active'));
      d.classList.add('active');
      document.querySelectorAll('.act-card').forEach(x=>x.classList.remove('active'));
      document.getElementById('act-'+a.n).classList.add('active');
    });
    nav.appendChild(d);
  });
}

function buildActs(){
  const con=document.getElementById('act-container');
  ACTS.forEach((a,i)=>{
    const waveRows=a.waves.map(w=>`
      <div class="wave-row">
        <span class="wave-badge w-${w.type}">${w.label}</span>
        <span class="wave-desc">${w.desc}</span>
      </div>`).join('');

    const cellsHtml=a.cellTypes.map(c=>{
      const cls=CELL_COLORS[c]||'t-normal';
      const em=CELL_EMOJI[c]||'';
      return `<div class="t-cell ${cls}">${em}</div>`;
    }).join('');

    const legendItems={};
    a.cellTypes.forEach(c=>{if(c!=='n')legendItems[c]=1;});
    const legendMap={b:'树木（不可用）',s:'特殊地形',d:'熔岩（不可用）',e:'敌兵出口',h:'雷击高发区',w:'水流主道',v:'悬崖边缘（高风险）',c:'城堡'};
    const legendHtml=Object.keys(legendItems).map(c=>`
      <div class="legend-item"><div class="legend-dot ${CELL_COLORS[c]}"></div>${legendMap[c]||c}</div>`).join('')+
      `<div class="legend-item"><div class="legend-dot t-normal"></div>普通格子槽位</div>`;

    con.innerHTML+=`
    <div class="act-card ${i===0?'active':''}" id="act-${a.n}" style="--act-col:${a.color}">
      <div class="act-left">
        <div class="panel act-hero">
          <div class="panel-head">
            <span class="act-num-big">ACT ${a.n}</span>
            <span class="act-name-big">${a.emoji} ${a.name}</span>
          </div>
          <div class="panel-body">
            <div class="act-terrain-label" style="margin-bottom:10px;">🗺 ${a.terrain}</div>
            <div class="terrain-preview">${cellsHtml}</div>
            <div class="grid-legend">${legendHtml}</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><span class="panel-icon">🌿</span><span class="panel-label">地形特效</span></div>
          <div class="panel-body">
            <div class="effect-box">
              <div class="effect-name">${a.terrainEffect.name}</div>
              ${a.terrainEffect.desc}
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><span class="panel-icon">💡</span><span class="panel-label">攻略提示</span></div>
          <div class="panel-body"><div class="tip-box">${a.tip}</div></div>
        </div>
      </div>
      <div class="act-right">
        <div class="panel">
          <div class="panel-head"><span class="panel-icon">⚔</span><span class="panel-label">波次设计</span></div>
          <div class="panel-body"><div class="wave-list">${waveRows}</div></div>
        </div>
      </div>
    </div>`;
  });
}

buildNav();buildActs();
</script>
